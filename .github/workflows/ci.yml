name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 20.x
          - os: macos-latest
            node: 26.x
          - os: ubuntu-latest
            node: 26.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run pack:check
      - name: Verify direct GitHub install
        env:
          SADDLE_GIT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SADDLE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:git-install -- "github:${SADDLE_GIT_REPOSITORY}#${SADDLE_GIT_SHA}"
